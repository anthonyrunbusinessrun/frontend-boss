name: BOSS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boss-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: boss_ci
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: boss_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boss_ci -d boss_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - name: Unit and isolated PostgreSQL integration tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://boss_ci:local_test_only@127.0.0.1:5432/boss_ci
      - name: Production build (no production credentials)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Authentication HTTP boundary tests
        run: npm run test:auth
        env:
          TEST_DATABASE_URL: postgres://boss_ci:local_test_only@127.0.0.1:5432/boss_ci
